services:
  db:
    image: postgres:16-alpine
    container_name: canttouchme-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canttouchme}
      POSTGRES_USER: ${POSTGRES_USER:-canttouchme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canttouchme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
