services:
  db:
    image: postgres:16-alpine
    container_name: canttouchme-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canttouchme}
      POSTGRES_USER: ${POSTGRES_USER:-canttouchme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canttouchme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: canttouchme-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-canttouchme}:${POSTGRES_PASSWORD:-canttouchme}@db:5432/${POSTGRES_DB:-canttouchme}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: canttouchme-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
